[package]
name = "gptpp-native"
version = "0.1.0"
description = "GPT++ Native Host - local capability boundary for the GPT++ extension (Chrome Native Messaging)."
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
